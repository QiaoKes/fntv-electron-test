name: Release Build

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean npm config
        run: |
          rm -f .npmrc
        shell: bash
        continue-on-error: true

      - name: Install dependencies
        run: npm install --no-optional --no-audit --no-fund
        timeout-minutes: 10

      - name: Install macOS specific dependencies
        if: runner.os == 'macOS'
        run: |
          # 确保 dmg-license 正确安装
          npm install dmg-license --save-dev
          # 安装额外的 macOS 构建依赖
          npm install --no-optional
        timeout-minutes: 5

      - name: Setup Python (for native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        continue-on-error: true

      - name: Download third-party dependencies
        run: |
          echo "🔄 Downloading latest fntv-mpv-config..."
          
          # 重试函数
          retry_download() {
            local max_attempts=5
            local delay=2
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "📡 尝试获取 release 信息 (第 $attempt/$max_attempts 次)..."
              
              # 获取最新 release 的下载链接
              LATEST_RELEASE=$(curl -s --connect-timeout 10 --max-time 30 \
                -H "Accept: application/vnd.github+json" \
                -H "User-Agent: GitHub-Actions" \
                https://api.github.com/repos/QiaoKes/fntv-mpv-config/releases/latest)
              
              # 检查 curl 是否成功
              if [ $? -eq 0 ] && [ -n "$LATEST_RELEASE" ]; then
                # 提取下载链接
                DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | sed -n 's/.*"browser_download_url": "\(https[^"]*\.zip\)".*/\1/p')
                
                if [ -n "$DOWNLOAD_URL" ]; then
                  echo "✅ 成功获取下载链接: $DOWNLOAD_URL"
                  return 0
                else
                  echo "⚠️  API 响应正常但未找到 zip 文件链接"
                fi
              else
                echo "❌ API 请求失败或返回空响应"
              fi
              
              if [ $attempt -lt $max_attempts ]; then
                echo "⏳ 等待 ${delay} 秒后重试..."
                sleep $delay
                delay=$((delay * 2))  # 指数退避
              fi
              
              attempt=$((attempt + 1))
            done
            
            echo "❌ 所有重试都失败了"
            return 1
          }
          
          # 执行重试下载
          if retry_download; then
            echo "📦 开始下载文件..."
            
            # 下载文件也添加重试
            download_attempts=5
            download_success=0
            
            for i in $(seq 1 $download_attempts); do
              echo "⬇️  下载尝试 $i/$download_attempts"
              if curl -L --connect-timeout 30 --max-time 300 -o mpv-config.zip "$DOWNLOAD_URL"; then
                # 验证文件是否下载成功
                if [ -f mpv-config.zip ] && [ -s mpv-config.zip ]; then
                  echo "✅ 文件下载成功"
                  download_success=1
                  break
                else
                  echo "❌ 下载的文件为空或不存在"
                fi
              else
                echo "❌ 下载失败"
              fi
              
              if [ $i -lt $download_attempts ]; then
                echo "⏳ 等待 5 秒后重试下载..."
                sleep 5
              fi
            done
            
            if [ $download_success -eq 0 ]; then
              echo "❌ 文件下载失败，退出构建"
              exit 1
            fi
            
            # 创建目标目录
            mkdir -p third_party/fntv-mpv
            
            # 解压文件
            echo "📂 解压文件到 third_party/fntv-mpv..."
            if [ "$RUNNER_OS" = "Windows" ]; then
              # Windows 使用 PowerShell 解压
              if powershell -Command "Expand-Archive -Path mpv-config.zip -DestinationPath third_party/fntv-mpv -Force"; then
                echo "✅ 解压成功"
                # Windows 删除文件
                powershell -Command "Remove-Item -Path mpv-config.zip -Force -ErrorAction SilentlyContinue"
              else
                echo "❌ 解压失败"
                exit 1
              fi
            else
              # macOS 和 Linux 使用 unzip
              if unzip -q mpv-config.zip -d third_party/fntv-mpv; then
                echo "✅ 解压成功"
                # macOS 和 Linux 删除文件
                rm -f mpv-config.zip
              else
                echo "❌ 解压失败"
                exit 1
              fi
            fi
          else
            echo "❌ 无法获取下载链接，构建失败"
            exit 1
          fi
          
          # 验证下载和解压结果
          echo "📁 验证目录结构..."
          if [ -d "third_party/fntv-mpv" ]; then
            echo "✅ third_party/fntv-mpv 目录存在"
            
            # 显示目录结构
            if [ "$RUNNER_OS" = "Windows" ]; then
              # Windows 使用 PowerShell 列出目录
              powershell -Command "if (Test-Path 'third_party/fntv-mpv') { Get-ChildItem -Path 'third_party/fntv-mpv' -Recurse | Select-Object -First 10 | ForEach-Object { Write-Host \$_.FullName } } else { Write-Host 'Directory not found' }"
            else
              # macOS 和 Linux 使用 find
              find third_party/fntv-mpv -type f | head -10
            fi
          else
            echo "❌ third_party/fntv-mpv 目录不存在"
            exit 1
          fi
        shell: bash

      - name: Compile TypeScript
        run: npm run compile
        timeout-minutes: 5

      - name: Import macOS certificate
        if: runner.os == 'macOS'
        run: |
          security import build/electron-dev-cert.p12 -k ~/Library/Keychains/login.keychain-db -P "fntv123456" -T /usr/bin/codesign -A
        continue-on-error: true

      - name: Build application
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            npm run build:win
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            npm run build:mac
          else
            npm run build:linux
          fi
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: release/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "date=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_OUTPUT

      - name: Get package version
        id: package
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: 飞牛影视 v${{ steps.package.outputs.version }}
          body: |
            ## 🎬 飞牛影视 v${{ steps.package.outputs.version }}
            
            ### 📦 构建信息
            - **提交哈希**: `${{ steps.commit.outputs.sha }}`
            - **提交作者**: ${{ steps.commit.outputs.author }}
            - **构建时间**: ${{ steps.commit.outputs.date }}
            - **源分支**: `release`
            
            ### 💻 支持平台
            - ✅ Windows (x64)
            - ✅ macOS (Intel & Apple Silicon)
            - ✅ Linux (x64 & ARM64)
            
            ### 📥 下载指南
            | 平台 | 文件类型 | 说明 |
            |------|----------|------|
            | 💻 Windows | `.exe` | 安装程序，双击运行 |
            | 🍎 macOS | `.dmg` | 磁盘镜像，拖拽到应用程序文件夹 |
            | 🐧 Linux | `.AppImage` | 便携应用，添加执行权限后直接运行 |
            
            ### 🔄 更新内容
            ```
            ${{ steps.commit.outputs.message }}
            ```
            
            ---
            *自动构建于 GitHub Actions* 🤖
          files: |
            artifacts/windows-build/*.exe
            artifacts/macos-build/*.dmg
            artifacts/linux-build/*.AppImage
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
