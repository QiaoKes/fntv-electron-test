name: Release Build

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean npm config
        run: |
          rm -f .npmrc
        shell: bash
        continue-on-error: true

      - name: Install dependencies
        run: npm install --no-optional --no-audit --no-fund
        timeout-minutes: 10

      - name: Install macOS specific dependencies
        if: runner.os == 'macOS'
        run: |
          # 确保 dmg-license 正确安装
          npm install dmg-license --save-dev
          # 安装额外的 macOS 构建依赖
          npm install --no-optional
        timeout-minutes: 5

      - name: Setup Python (for native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        continue-on-error: true

      - name: Download third-party dependencies
        run: |
          echo "🔄 Downloading latest fntv-mpv-config..."
          
          # 获取最新 release 的下载链接 (使用认证以避免速率限制)
          LATEST_RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/QiaoKes/fntv-mpv-config/releases/latest)
          echo "Latest release info: $LATEST_RELEASE"
          DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | sed -n 's/.*"browser_download_url": "\(https[^"]*\.zip\)".*/\1/p')

          echo "最新下载链接: $DOWNLOAD_URL"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ No zip file found, using fallback..."
            # 直接退出
            exit 1
          else
            echo "📦 Downloading from: $DOWNLOAD_URL"
            
            # 下载文件 (使用认证下载)
            curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o mpv-config.zip "$DOWNLOAD_URL"
            mkdir -p third_party/fntv-mpv
            
            # 根据平台使用不同的解压命令
            if [ "$RUNNER_OS" = "Windows" ]; then
              # Windows 使用 PowerShell 解压
              powershell -Command "Expand-Archive -Path mpv-config.zip -DestinationPath third_party/fntv-mpv -Force"
              # Windows 删除文件
              powershell -Command "Remove-Item -Path mpv-config.zip -Force -ErrorAction SilentlyContinue"
            else
              # macOS 和 Linux 使用 unzip
              unzip -q mpv-config.zip -d third_party/fntv-mpv
              # macOS 和 Linux 删除文件
              rm -f mpv-config.zip
            fi
          fi
          
          echo "📁 Final structure:"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows 使用 PowerShell 列出目录
            powershell -Command "Get-ChildItem -Path third_party/fntv-mpv -Directory -Recurse | Select-Object -First 5 | ForEach-Object { Write-Host \$_.FullName }"
          else
            # macOS 和 Linux 使用 find
            find third_party/fntv-mpv -type d | head -5
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile TypeScript
        run: npm run compile
        timeout-minutes: 5

      - name: Verify certificate file
        if: runner.os == 'macOS'
        run: |
          echo "🔍 验证证书文件..."
          if [ -f "build/electron-dev-cert.p12" ]; then
            echo "✅ 证书文件存在: build/electron-dev-cert.p12"
            # 检查证书内容（不显示敏感信息）
            openssl pkcs12 -in build/electron-dev-cert.p12 -nokeys -noout -passin pass:fntv123456 2>/dev/null && echo "✅ 证书文件格式有效" || echo "❌ 证书文件格式无效"
          else
            echo "❌ 证书文件不存在: build/electron-dev-cert.p12"
            ls -la build/
            exit 1
          fi

      - name: Import macOS certificate
        if: runner.os == 'macOS'
        run: |
          # 创建临时 keychain
          TEMP_KEYCHAIN="temp-build.keychain-db"
          TEMP_KEYCHAIN_PATH="$HOME/Library/Keychains/$TEMP_KEYCHAIN"
          TEMP_KEYCHAIN_PASSWORD="temp-build-password"
          
          echo "🔐 创建临时 keychain: $TEMP_KEYCHAIN"
          security create-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$TEMP_KEYCHAIN_PATH"
          
          # 将临时 keychain 添加到搜索列表（而不是设为默认）
          security list-keychains -d user -s "$TEMP_KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          
          # 解锁临时 keychain
          security unlock-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$TEMP_KEYCHAIN_PATH"
          
          # 设置 keychain 超时（避免自动锁定）
          security set-keychain-settings -t 3600 -u "$TEMP_KEYCHAIN_PATH"
          
          # 导入证书到临时 keychain
          echo "📄 导入证书到临时 keychain..."
          security import build/electron-dev-cert.p12 -k "$TEMP_KEYCHAIN_PATH" -P "fntv123456" -T /usr/bin/codesign -A
          
          # 设置证书可用于代码签名
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$TEMP_KEYCHAIN_PASSWORD" "$TEMP_KEYCHAIN_PATH"
          
          # 🔑 关键步骤：信任证书用于代码签名
          echo "🛡️ 信任证书用于代码签名..."
          # 首先从 keychain 中导出证书
          security find-certificate -c "electron-dev-cert" -p "$TEMP_KEYCHAIN_PATH" > /tmp/electron-dev-cert.pem
          
          # 将证书添加到系统信任存储中
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain /tmp/electron-dev-cert.pem
          
          # 或者直接在当前用户的 keychain 中信任
          security add-trusted-cert -d -r trustAsRoot -k "$TEMP_KEYCHAIN_PATH" /tmp/electron-dev-cert.pem || true
          
          # 验证证书导入和信任状态
          echo "✅ 验证证书导入..."
          security find-identity -v -p codesigning "$TEMP_KEYCHAIN_PATH"
          
          # 获取证书的 SHA1 哈希值（修复提取逻辑）
          CERT_OUTPUT=$(security find-identity -v -p codesigning "$TEMP_KEYCHAIN_PATH" | grep "electron-dev-cert")
          echo "🔍 完整证书输出: $CERT_OUTPUT"
          
          # 提取哈希值（在括号前的部分）
          CERT_HASH=$(echo "$CERT_OUTPUT" | sed -n 's/^[[:space:]]*[0-9]*)[[:space:]]*\([A-F0-9]*\)[[:space:]].*/\1/p')
          echo "🆔 提取的证书哈希值: $CERT_HASH"
          
          # 如果哈希值为空或无效，尝试不同的提取方法
          if [ -z "$CERT_HASH" ] || [ "$CERT_HASH" = "valid" ]; then
            echo "⚠️ 第一次提取失败，尝试其他方法..."
            # 尝试提取第一个有效证书的哈希值
            CERT_HASH=$(security find-identity -v -p codesigning "$TEMP_KEYCHAIN_PATH" | head -1 | sed -n 's/^[[:space:]]*[0-9]*)[[:space:]]*\([A-F0-9][A-F0-9]*\)[[:space:]].*/\1/p')
            echo "🆔 使用备用方法提取的哈希值: $CERT_HASH"
          fi
          
          # 最后一种方法：直接使用证书名称
          if [ -z "$CERT_HASH" ] || [ "$CERT_HASH" = "valid" ]; then
            echo "⚠️ 哈希值提取失败，使用证书名称..."
            CERT_HASH="electron-dev-cert"
            echo "🆔 使用证书名称: $CERT_HASH"
          fi
          
          # 清理临时文件
          rm -f /tmp/electron-dev-cert.pem
          
          # 导出环境变量供后续步骤使用
          echo "TEMP_KEYCHAIN_PATH=$TEMP_KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "TEMP_KEYCHAIN_PASSWORD=$TEMP_KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "CERT_HASH=$CERT_HASH" >> $GITHUB_ENV

      - name: Debug signing identities
        if: runner.os == 'macOS'
        run: |
          echo "🔍 检查临时 keychain 中的签名身份..."
          security find-identity -v -p codesigning "$TEMP_KEYCHAIN_PATH"
          echo ""
          echo "🔍 查找 electron-dev-cert 证书..."
          security find-identity -v -p codesigning "$TEMP_KEYCHAIN_PATH" | grep "electron-dev-cert" || echo "未找到 electron-dev-cert"
          echo ""
          echo "🔍 检查证书详情..."
          security find-certificate -c "electron-dev-cert" -p "$TEMP_KEYCHAIN_PATH" | openssl x509 -text -noout | head -20 || echo "无法获取证书详情"
          echo ""
          echo "🔍 提取的证书哈希值: $CERT_HASH"
          echo "🔍 完整证书信息:"
          security find-identity -p codesigning "$TEMP_KEYCHAIN_PATH" | grep "$CERT_HASH" || echo "未找到对应哈希的证书"

      - name: Build application
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            npm run build:win
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            echo "🔧 配置 macOS 代码签名环境..."
            echo "使用临时 keychain: $TEMP_KEYCHAIN_PATH"
            echo "使用证书标识符: $CERT_HASH"
            
            # 确保临时 keychain 仍然解锁
            security unlock-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$TEMP_KEYCHAIN_PATH"
            
            # 验证 keychain 和证书状态
            echo "🔍 当前 keychain 列表:"
            security list-keychains -d user
            echo "🔍 临时 keychain 中的签名身份:"
            security find-identity -v -p codesigning "$TEMP_KEYCHAIN_PATH"
            echo "🔍 系统中所有可用的签名身份:"
            security find-identity -v -p codesigning
            
            # 检查是否有可用的签名身份
            IDENTITY_COUNT=$(security find-identity -v -p codesigning "$TEMP_KEYCHAIN_PATH" | grep -c "electron-dev-cert" || echo "0")
            echo "🔢 找到 $IDENTITY_COUNT 个 electron-dev-cert 证书"
            
            if [ "$IDENTITY_COUNT" -gt 0 ]; then
              echo "✅ 找到有效证书，启用代码签名"
              # 设置 electron-builder 环境变量
              export CSC_KEYCHAIN="$TEMP_KEYCHAIN_PATH"
              export CSC_LINK="build/electron-dev-cert.p12"
              export CSC_KEY_PASSWORD="fntv123456"
              export CSC_NAME="$CERT_HASH"
              # 启用 DMG 签名
              export CSC_INSTALLER_LINK="$CSC_LINK"
              export CSC_INSTALLER_KEY_PASSWORD="$CSC_KEY_PASSWORD"
              export CSC_INSTALLER_KEYCHAIN="$TEMP_KEYCHAIN_PATH"
              
              echo "🏗️ 开始构建 macOS 应用（启用代码签名和 DMG 签名）..."
              echo "环境变量配置:"
              echo "CSC_KEYCHAIN=$CSC_KEYCHAIN"
              echo "CSC_LINK=$CSC_LINK"
              echo "CSC_NAME=$CSC_NAME"
              echo "CSC_INSTALLER_LINK=$CSC_INSTALLER_LINK"
              echo "CSC_INSTALLER_KEYCHAIN=$CSC_INSTALLER_KEYCHAIN"
            else
              echo "⚠️ 未找到有效证书，跳过代码签名"
              # 禁用代码签名
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset CSC_LINK
              unset CSC_KEY_PASSWORD
              unset CSC_NAME
              
              echo "🏗️ 开始构建 macOS 应用（无代码签名）..."
            fi
            
            npm run build:mac
          else
            npm run build:linux
          fi
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: release/
          retention-days: 30

      - name: Cleanup macOS keychain
        if: runner.os == 'macOS' && always()
        run: |
          echo "🧹 清理临时 keychain 和信任设置..."
          
          # 尝试从系统信任存储中移除证书
          if sudo security find-certificate -c "electron-dev-cert" /Library/Keychains/System.keychain >/dev/null 2>&1; then
            echo "📄 从系统信任存储中移除证书..."
            sudo security delete-certificate -c "electron-dev-cert" /Library/Keychains/System.keychain || true
          fi
          
          # 清理临时 keychain
          if [ -n "$TEMP_KEYCHAIN_PATH" ] && [ -f "$TEMP_KEYCHAIN_PATH" ]; then
            # 锁定并删除临时 keychain
            security lock-keychain "$TEMP_KEYCHAIN_PATH" || true
            security delete-keychain "$TEMP_KEYCHAIN_PATH" || true
            echo "✅ 临时 keychain 已清理"
          else
            echo "⚠️ 未找到临时 keychain 或路径为空"
          fi

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "date=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_OUTPUT

      - name: Get package version
        id: package
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: 飞牛影视 v${{ steps.package.outputs.version }}
          body: |
            ## 🎬 飞牛影视 v${{ steps.package.outputs.version }}
            
            ### 📦 构建信息
            - **提交哈希**: `${{ steps.commit.outputs.sha }}`
            - **提交作者**: ${{ steps.commit.outputs.author }}
            - **构建时间**: ${{ steps.commit.outputs.date }}
            - **源分支**: `release`
            
            ### 💻 支持平台
            - ✅ Windows (x64)
            - ✅ macOS (Intel & Apple Silicon)
            - ✅ Linux (x64 & ARM64)
            
            ### 📥 下载指南
            | 平台 | 文件类型 | 说明 |
            |------|----------|------|
            | 💻 Windows | `.exe` | 安装程序，双击运行 |
            | 🍎 macOS | `.dmg` | 磁盘镜像，拖拽到应用程序文件夹 |
            | 🐧 Linux | `.AppImage` | 便携应用，添加执行权限后直接运行 |
            
            ### 🔄 更新内容
            ```
            ${{ steps.commit.outputs.message }}
            ```
            
            ---
            *自动构建于 GitHub Actions* 🤖
          files: |
            artifacts/windows-build/*.exe
            artifacts/macos-build/*.dmg
            artifacts/linux-build/*.AppImage
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
